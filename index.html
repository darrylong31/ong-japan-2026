<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Japan Trip 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#241412" media="(prefers-color-scheme: dark)">

<!-- Yusei Magic, only the characters the sound-effect words and month accents use (tiny download):
     スゴイワクヤッタキラドネー12月 — add any new character here too -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&amp;text=%E3%82%B9%E3%82%B4%E3%82%A4%E3%83%AF%E3%82%AF%E3%83%A4%E3%83%83%E3%82%BF%E3%82%AD%E3%83%A9%E3%83%89%E3%83%8D%E3%83%BC12%E6%9C%88&amp;display=swap">

<style>
  /* ---------- Colour tokens (light) ---------- */
  :root {
    --paper: #f3ddd4;        /* page background: warm persimmon-tinted paper */
    --wash-a: #e5ab98;       /* red washes behind the page */
    --wash-b: #f0c79f;
    --card: #fffaf5;
    --ink: #2e1c1a;          /* main text + drawn lines */
    --ink-soft: #6b4d48;
    --line: #d6ada0;
    --accent: #a8321f;       /* torii red: buttons */
    --usj: #a8321f;          /* group 1 colour */
    --md: #2f4a6b;           /* group 2 colour: indigo */
    --md-wash: #dbe4ee;
    --sun: #e3a129;
    --sun-wash: #fae6b8;
    --day-1: #c9e0ea; --day-2: #edf1e9;       /* postcard sky: top and bottom colour per time of day */
    --morn-1: #f3c2c0; --morn-2: #fde9c8;
    --dusk-1: #e88f5e; --dusk-2: #f4bd7a;
    --night-1: #121831; --night-2: #2b3258;
    --moon: #f4f0dc;
    --window-glow: #ffcf5c;  /* warm lit windows at night */
    --night-ink: #f5e9e3;    /* header text colour while the sky is night */
    --bill: #e2efd8; --bill-ink: #1f5a36; --on-accent: #ffffff; --btn2: #2f4a6b; --on-btn2: #ffffff; --snow: #ffffff;   /* filled map buttons, snowflakes */
    --glow: #2fd07a; --sparkle: #f0b400; --bill-text: #ffffff; --bill-outline: #000000;   /* Matt's banknote banner */
    --scene-far: #a3b4c2;
    --scene-near: #56687a;
    --scene-hill: #c2907c;
    --skin: #f1d3b8;         /* stick figures */
    --fig-line: var(--ink); --fig-body: var(--ink); --maroon: #7a1f33;   /* Mum's glasses */
    --hair-black: #22262b;
    --hair-dark: #453a36;
    --hair-brown: #5e3a22;
    --hair-darkbrown: #43281a;
    --hair-light: #9a6a3e;   /* Dan */
    --metal: #6f7780;        /* Matt's glasses */
    --hair-blond: #dcb65c;
    --focus: #1f4f8a;
    --shadow: rgba(40, 15, 10, 0.35);
  }
  /* ---------- Same tokens, dark values (must be in BOTH places) ---------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #241412; --wash-a: #4f1e17; --wash-b: #3d2613; --card: #33201d;
      --ink: #f5e9e3; --ink-soft: #cdb0a8; --line: #6a443d;
      --accent: #f39a80; --usj: #f39a80; --md: #a9c4e6; --md-wash: #263648;
      --sun: #edbd5a; --sun-wash: #4d3a1a;
      --day-1: #2f4a62; --day-2: #45606c; --morn-1: #63404a; --morn-2: #7d4f3c;
      --dusk-1: #7c3f2c; --dusk-2: #96562e; --night-1: #0a0e20; --night-2: #1a2040;
      --moon: #f4f0dc; --window-glow: #f6c453; --night-ink: #f5e9e3; --bill: #1c3626; --bill-ink: #a8e6bf; --on-accent: #2a0f0a; --btn2: #a9c4e6; --on-btn2: #14202e; --snow: #dfe8f2; --glow: #3ddc84; --sparkle: #fff3b0; --bill-text: #ffffff; --bill-outline: #000000; --scene-far: #263746; --scene-near: #161d26; --scene-hill: #4a2f2a;
      --fig-line: #140a08; --fig-body: #a88276; --maroon: #8f2540;   /* figures in dark: dark cartoon outlines, softer body */
      --skin: #e9c9ad; --hair-black: #6b7480; --hair-dark: #8a776e; --hair-brown: #a06b45; --hair-darkbrown: #8f5e3f; --hair-light: #c9996a; --metal: #cfd6de; --hair-blond: #ebcb74;
      --focus: #9cc7ff; --shadow: rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #241412; --wash-a: #4f1e17; --wash-b: #3d2613; --card: #33201d;
    --ink: #f5e9e3; --ink-soft: #cdb0a8; --line: #6a443d;
    --accent: #f39a80; --usj: #f39a80; --md: #a9c4e6; --md-wash: #263648;
    --sun: #edbd5a; --sun-wash: #4d3a1a;
    --day-1: #2f4a62; --day-2: #45606c; --morn-1: #63404a; --morn-2: #7d4f3c;
    --dusk-1: #7c3f2c; --dusk-2: #96562e; --night-1: #0a0e20; --night-2: #1a2040;
    --moon: #f4f0dc; --window-glow: #f6c453; --night-ink: #f5e9e3; --bill: #1c3626; --bill-ink: #a8e6bf; --on-accent: #2a0f0a; --btn2: #a9c4e6; --on-btn2: #14202e; --snow: #dfe8f2; --glow: #3ddc84; --sparkle: #fff3b0; --bill-text: #ffffff; --bill-outline: #000000; --scene-far: #263746; --scene-near: #161d26; --scene-hill: #4a2f2a;
    --fig-line: #140a08; --fig-body: #a88276; --maroon: #8f2540;   /* figures in dark: dark cartoon outlines, softer body */
    --skin: #e9c9ad; --hair-black: #6b7480; --hair-dark: #8a776e; --hair-brown: #a06b45; --hair-darkbrown: #8f5e3f; --hair-light: #c9996a; --metal: #cfd6de; --hair-blond: #ebcb74;
    --focus: #9cc7ff; --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }

  /* ---------- Base ---------- */
  /* --s is a shrink factor for text inside the group cards only.
     Normal: card text is 88% size. Large: back to 100%, on top of the 125% root size (so Large is unchanged). */
  :root { --s: 0.88; }
  :root.large { font-size: 125%; --s: 1; }   /* "Large" text: everything is sized in rem, so it all scales */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(30rem 18rem at 0% 0%, var(--wash-a), transparent 70%),
      radial-gradient(26rem 20rem at 100% 32rem, var(--wash-b), transparent 70%),
      var(--paper);
    color: var(--ink);
    font-family: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 1.0625rem;
    font-weight: 500;
    line-height: 1.5;
  }
  .page {
    max-width: 30rem;
    margin-inline: auto;
    /* no host wrapper on GitHub Pages, so keep clear of the notch and home bar ourselves */
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
    padding-bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }
  h1, h2, h3, p, ol { margin: 0; }
  /* Normal: shrink with the screen width (vw) so the date always fits on one line. Large: full size, may wrap. */
  h1, .h1 { font-size: min(1.8rem, 6.5vw); white-space: nowrap; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
  :root.large h1, :root.large .h1 { font-size: 1.8rem; white-space: normal; }
  h2 { font-size: calc(1.3rem * var(--s)); font-weight: 800; line-height: 1.2; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }

  /* ---------- Buttons and links ---------- */
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0.3rem 0.85rem;
    border-radius: 0.8rem; border: 2px solid var(--ink); background: var(--card); color: var(--ink);
    font-weight: 700; font-size: calc(0.9rem * var(--s)); text-decoration: none;
  }
  .btn-google { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-apple { background: var(--btn2); border-color: var(--btn2); color: var(--on-btn2); }
  .dir { margin-top: 0.6rem; }
  .dir-label { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.14em; color: var(--ink-soft); }
  .dir-btns { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.15rem; }

  /* ---------- Matt banner: a glowing banknote that floats OVER the page (fixed), so nothing shifts ---------- */
  .matt {
    position: fixed; z-index: 25;
    top: calc(1.25rem + env(safe-area-inset-top, 0px));
    left: max(1.25rem, env(safe-area-inset-left, 0px)); right: max(1.25rem, env(safe-area-inset-right, 0px));
    max-width: 24rem; margin-inline: auto; padding: 0;
    background: none; border: 0; text-align: center;
    transition: opacity 0.3s;
  }
  .matt.pop { animation: pop 0.45s ease-out; }
  .matt.gone { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.5s, visibility 0s 0.5s; }
  .bill {
    position: relative; display: block; overflow: hidden;
    padding: 1.7rem 2.3rem;
    background: var(--bill); border: 6px double var(--bill-ink); border-radius: 0.4rem;
    box-shadow: 0 0 0 3px var(--glow), 0 0 1.2rem 0.4rem var(--glow);
    animation: glow 0.7s ease-in-out infinite alternate;
    font-weight: 800; font-size: 1.1rem; line-height: 1.3;
  }
  .bill-art { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.13; }   /* faint money patterns */
  .bill-text {   /* white letters with a black outline; paint-order draws the outline BEHIND the letters */
    position: relative; color: var(--bill-text); font-size: 1.2rem;
    -webkit-text-stroke: 4px var(--bill-outline); paint-order: stroke fill;
  }
  .corner { position: absolute; font: 800 0.8rem Georgia, "Times New Roman", serif; color: var(--bill-ink); }
  .c1 { top: 0.2rem; left: 0.45rem; } .c2 { top: 0.2rem; right: 0.45rem; }
  .c3 { bottom: 0.2rem; left: 0.45rem; } .c4 { bottom: 0.2rem; right: 0.45rem; }
  .sparkle {   /* a four-point star, cut out of a coloured square */
    position: absolute; background: var(--sparkle); pointer-events: none;
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
    animation: twinkle 0.9s ease-in-out infinite;
  }
  @keyframes pop {
    from { transform: scale(0.6) rotate(-6deg); }
    60% { transform: scale(1.05) rotate(2deg); }
    to { transform: scale(1) rotate(0); }
  }
  @keyframes glow {
    from { box-shadow: 0 0 0 3px var(--glow), 0 0 0.5rem 0.1rem var(--glow); }
    to { box-shadow: 0 0 0 3px var(--glow), 0 0 1.8rem 0.6rem var(--glow); }
  }
  @keyframes twinkle {
    0%, 100% { transform: scale(0) rotate(0); }
    50% { transform: scale(1) rotate(45deg); }
  }

  /* ---------- Control bar: Calendar | text size | Help ---------- */
  .bar {
    display: grid; grid-template-columns: 1fr 1fr 1.35fr;
    border: 2px solid var(--ink); border-radius: 0.8rem; overflow: hidden; background: var(--card); color: var(--ink);
  }
  .bar button { min-height: 44px; min-width: 0; padding: 0.3rem 0.4rem; border: 0; border-left: 2px solid var(--ink); background: transparent; font-weight: 700; font-size: 0.875rem; line-height: 1.2; }
  .bar button:first-child { border-left: 0; }
  .bar button:focus-visible { outline-offset: -4px; }

  /* ---------- Postcard header ---------- */
  .postcard {
    position: relative; overflow: hidden;
    background: linear-gradient(var(--day-1), var(--day-2));
    border: 2px solid var(--ink); border-radius: 1.2rem;
  }
  /* The postcard's top part ("stage") is layered, back to front:
     track (the day's sky colours, stars and text: this is what slides with your finger) →
     sun + moon (stay put, ride their own arc) →
     landmarks + snow (stay put) → focus lines → the control bar (stays put). */
  .stage { position: relative; overflow: hidden; touch-action: pan-y pinch-zoom; }   /* we handle sideways drags; the browser keeps vertical scroll + zoom */
  .track { position: relative; z-index: 0; will-change: transform; }
  .slide { position: relative; background: linear-gradient(var(--day-1), var(--day-2)); }
  .slide.prev, .slide.next { position: absolute; top: 0; bottom: 0; width: 100%; }   /* neighbouring days wait just off-screen */
  .slide.prev { left: -100%; }
  .slide.next { left: 100%; }
  .pc-top, .scene, .pc-caption { position: relative; z-index: 1; }   /* sit above the sky layers */
  .pc-top { padding: 0.75rem 0.75rem 0; }
  .bar-float { position: absolute; z-index: 3; top: 0.75rem; left: 0.75rem; right: 0.75rem; }
  .bar-spacer { visibility: hidden; }   /* an invisible copy of the bar inside each slide, so the text starts below it at any text size */
  .landmarks, .bodies { position: absolute; inset: 0; z-index: 1; pointer-events: none; }   /* .bodies = sun + moon, behind the landmarks */
  .landmarks > svg, .bodies > svg { position: absolute; left: 0; bottom: 0; display: block; width: 100%; height: auto; }
  .daytitle { margin-top: 0.9rem; }
  .eyebrow { font-weight: 800; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
  /* The fun day title: the hero line of the postcard. Chunky, slightly tilted, red with a pale outline
     so it reads over every sky. Normal: one line; fitTitle() in the script shrinks long ones to fit. */
  .funtitle {
    margin: 0.7rem 0 0.5rem; transform: rotate(-3deg); transform-origin: left bottom;
    font-size: min(3rem, 12.5vw); font-weight: 900; line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap;
    color: var(--accent);
    -webkit-text-stroke: 0.14em var(--card); paint-order: stroke fill;   /* outline drawn behind the letters */
    text-shadow: 0.06em 0.09em 0 var(--shadow);
  }
  :root.large .funtitle { font-size: 2.4rem; white-space: normal; overflow-wrap: anywhere; }
  .funtitle .emoji { -webkit-text-stroke: 0; text-shadow: none; }
  .scene > svg { display: block; width: 100%; height: auto; }
  :root.large .scene { padding-top: 2.6rem; }   /* Large: the weather text is taller, so push the picture down */
  .scene.multi { padding-top: 1.2rem; }        /* travel days: two cities of weather text */
  :root.large .scene.multi { padding-top: 3.6rem; }
  .facts { position: absolute; left: 0.75rem; right: 0.75rem; top: 0.5rem; display: flex; align-items: center; gap: 0.6rem; }
  .facts svg { width: 3.6rem; height: 2.7rem; flex: none; }
  .temps { font-weight: 800; font-size: 1.5rem; line-height: 1.1; }
  .temps small { font-size: 0.95rem; font-weight: 500; }
  .multi .temps { font-size: 1.1rem; }
  .nw { white-space: nowrap; }
  .pc-caption { background: var(--card); padding: 0.9rem; border-top: 2px solid var(--ink); }
  .mum { margin-top: 0.6rem; padding: 0.6rem 0.75rem; background: var(--md-wash); border-left: 4px solid var(--md); border-radius: 0.3rem 0.8rem 0.8rem 0.3rem; }

  /* Sky: the postcard background is the DAY sky. Three more skies are stacked on top, invisible until needed. */
  .sky { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .sky-morning { background: linear-gradient(var(--morn-1), var(--morn-2)); }
  .sky-dusk { background: linear-gradient(var(--dusk-1), var(--dusk-2)); }
  .sky-night { background: linear-gradient(var(--night-1), var(--night-2)); }
  /* Resting sky = one of four states, set from the time in Japan (see skyStateInJapan in the script). */
  .is-morning .sky-morning, .is-dusk .sky-dusk, .is-night .sky-night { opacity: 1; }
  /* The sun and moon are placed on their arc by the script (see arcPoint), not by CSS. */
  .stars, .lights { opacity: 0; }   /* .lights = warm lit windows, night only */
  .fuji { opacity: 0.5; }
  .fuji-snow { opacity: 0.9; }
  .is-night .fuji-snow { opacity: 0.45; }   /* dimmer snow at night */
  .is-night .cloudsea { opacity: 0.55; }    /* air postcard: moonlit clouds, not glowing white */
  .is-night .stars, .is-night .lights { opacity: 1; }
  .is-night .pc-top, .is-night .facts { color: var(--night-ink); }

  /* The day-change time-lapse (sky colours, stars, lights, focus lines, sun and moon) is driven by
     one clock in the script: see skyMix, drawLapse and startLapse (the sky follows the sun). */

  /* ---------- Swipeable group panels ---------- */
  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; font-weight: 700; }
  .dots { flex: none; }
  .dots i { display: inline-block; width: 0.7rem; height: 0.7rem; margin-left: 0.3rem; border: 2px solid var(--ink); border-radius: 50%; }
  .dots i.on { background: var(--ink); }
  .panels { display: flex; align-items: flex-start; gap: 0.75rem; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; padding: 0.25rem; margin-top: 1rem; }
  .pager + .panels { margin-top: 0; }
  .panel { flex: 0 0 88%; min-width: 0; scroll-snap-align: start; }
  .panels.single { touch-action: pan-y pinch-zoom; }   /* one card: a sideways drag here changes day instead */
  .panels.single .panel { flex-basis: 100%; }

  /* Stick figures peek up from behind the card: the card is pulled up over their lower half. */
  .figs { display: flex; align-items: flex-end; gap: 0.3rem; padding-left: 0.6rem; pointer-events: none; }
  .fig { display: flex; flex-direction: column; align-items: center; font-size: 0.8rem; font-weight: 700; min-width: 2.9rem; }
  .fig svg { width: 2.5rem; height: 3.5rem; overflow: visible; }   /* visible: Dad's TWEET! pokes out the side */
  .fig.child svg { width: 1.9rem; height: 2.65rem; margin-bottom: 0.45rem; }   /* lifted so half of her shows too */
  /* 5+ people: figures shrink with the screen width so 7 fit on a 360px phone at either text size.
     Dad is last in the row, so the right padding leaves room for his TWEET! */
  .figs.crowd { gap: 0.15rem; padding-right: 1rem; }
  .figs.crowd .fig { min-width: 0; flex: 0 1 auto; font-size: min(0.8rem, 3.1vw); }
  .figs.crowd .fig svg { width: min(2.5rem, 10.5vw); height: min(3.5rem, 14.7vw); }
  .figs.crowd .fig.child svg { width: min(1.9rem, 8vw); height: min(2.65rem, 11.2vw); margin-bottom: min(0.45rem, 1.9vw); }
  .card {
    position: relative; margin-top: -1.75rem;   /* half a figure's height */
    background: var(--card); border: 3px solid var(--usj); border-radius: 1.1rem; padding: 1rem;
    font-size: calc(1.0625rem * var(--s));
    overflow-wrap: anywhere;
  }
  .figs.crowd + .card { margin-top: calc(min(3.5rem, 14.7vw) * -0.5); }
  .card-md { border-color: var(--md); }

  /* ---------- Plan items ---------- */
  .timeline { list-style: none; padding: 0; margin-top: 0.9rem; }
  /* Each item is two columns: a narrow rail (dot + dotted line) and the text.
     The dot and the line are BOTH placed at left: 50% of the rail and pulled back by half their own width,
     so they share one centre line no matter the text size or how the phone rounds pixels. */
  .timeline li { display: grid; grid-template-columns: 1.1rem 1fr; column-gap: 0.6rem; }
  .rail { position: relative; }
  .dot {
    position: absolute; left: 50%; top: 0.3rem; transform: translateX(-50%);
    width: 0.8rem; height: 0.8rem; border: 2px solid var(--ink); border-radius: 50%; background: var(--card);
  }
  .line {   /* from the bottom of this dot (0.3 + 0.8rem) to the top of the next one (0.3rem into the next item) */
    position: absolute; left: 50%; top: 1.1rem; bottom: -0.3rem; transform: translateX(-50%);
    border-left: 2px dotted var(--ink-soft);
  }
  .item { min-width: 0; padding-bottom: 1.2rem; }
  .timeline li:last-child .line { display: none; }
  .timeline li:last-child .item { padding-bottom: 0; }
  .time { font-weight: 800; font-size: calc(0.85rem * var(--s)); letter-spacing: 0.03em; color: var(--usj); }
  .card-md .time { color: var(--md); }
  .title { font-weight: 700; font-size: calc(1.12rem * var(--s)); line-height: 1.25; }
  .note { color: var(--ink-soft); }
  .ticket { margin-top: 0.3rem; font-weight: 700; }
  .tips { margin-top: 1rem; display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
  .extra {   /* a small sticky note, very slightly tilted, held on with a strip of washi tape */
    position: relative; display: inline-block; margin-top: 0.6rem; padding: 0.35rem 0.65rem;
    background: var(--sun-wash); border-radius: 0.2rem 0.5rem 0.5rem 0.5rem; transform: rotate(-0.8deg);
  }
  .extra::before {   /* the tape */
    content: ""; position: absolute; top: -0.35rem; left: 0.7rem; width: 1.7rem; height: 0.6rem;
    background: var(--line); opacity: 0.75; transform: rotate(-5deg);
  }

  /* ---------- Meals: activities first, then this heading, then a two-column grid of meals ---------- */

  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.25rem; }

  .tile.blank { visibility: hidden; min-height: 0; }

  .tnum { font-weight: 800; font-size: 0.95rem; }

  .tcity { font-size: 0.55rem; font-weight: 800; color: var(--ink-soft); max-width: 100%; white-space: nowrap; overflow: hidden; }

    padding: calc(1.5rem + env(safe-area-inset-top, 0px)) max(1.5rem, env(safe-area-inset-right, 0px)) calc(1.5rem + env(safe-area-inset-bottom, 0px)) max(1.5rem, env(safe-area-inset-left, 0px));

<body>
<div class="page" id="page">
  <!-- Matt banner: floats over the page for ~3 seconds -->
  <button class="matt gone" id="matt" type="button" aria-label="Dismiss banner"></button>
  <!-- The page gets drawn in here by render() -->
  <main id="app"></main>
</div>
<!-- The huge "show the taxi driver" / phrase view. Tap anywhere to close. -->
<div class="big" id="big" role="dialog" aria-modal="true" hidden></div>

<script src="data.js"></script>
<script src="logic.js"></script>
<script>
  var TRIP = window.TRIP;
  var activeItinerary = TRIP.itineraries.filter(function (itinerary) { return itinerary.id === "darryl-josie"; })[0] || TRIP.itineraries[0];

  function groupKey(card) {
    return card.groupId || card.id || card.people.slice().sort().join("-");
  }
  function itineraryById(id) {
    return TRIP.itineraries.filter(function (itinerary) { return itinerary.id === id; })[0] || TRIP.itineraries[0];
  }
  function itineraryGroupName(itinerary, id) {
    var group = itinerary.groups.filter(function (item) { return item.id === id; })[0];
    return group ? group.name : itinerary.name;
  }
  function isPlaceholderCard(card) {
    if (card.activities.length !== 1) return false;
    var activity = card.activities[0];
    return /day trip|all day/i.test(activity.title) && /plan to come|family plan/i.test(activity.note || "");
  }
  function combineDays() {
    var main = TRIP.itineraries.filter(function (itinerary) { return itinerary.id === "darryl-josie"; })[0] || TRIP.itineraries[0];
    var mattChloe = TRIP.itineraries.filter(function (itinerary) { return itinerary.id === "matt-chloe"; })[0];
    var byDate = {};
    main.days.forEach(function (day) {
      var copy = Object.assign({}, day);
      copy.cards = day.cards.map(function (card) { return Object.assign({}, card); });
      copy.before = Object.assign({}, day.before || {}, { do: (day.before && day.before.do || []).slice(), bring: (day.before && day.before.bring || []).slice() });
      byDate[day.date] = copy;
    });
    if (mattChloe) {
      mattChloe.days.forEach(function (extra) {
        var day = byDate[extra.date];
        if (!day) {
          day = byDate[extra.date] = Object.assign({}, extra, {
            cards: extra.cards.map(function (card) { return Object.assign({}, card); }),
            before: Object.assign({}, extra.before || {}, { do: (extra.before && extra.before.do || []).slice(), bring: (extra.before && extra.before.bring || []).slice() }),
            mattChloeOnly: true,
          });
        } else {
          day.cards = day.cards.filter(function (card) { return !isPlaceholderCard(card); });
          extra.cards.forEach(function (card) {
            var duplicate = day.cards.some(function (existing) {
              return existing.groupId === card.groupId ||
                existing.people.slice().sort().join(",") === card.people.slice().sort().join(",");
            });
            if (!duplicate) day.cards.push(Object.assign({}, card));
          });
          day.mattChloeBefore = {
            do: (extra.before && extra.before.do || []).slice(),
            bring: (extra.before && extra.before.bring || []).slice(),
          };
        }
      });
    }
    return Object.keys(byDate).sort().map(function (date) { return byDate[date]; });
  }
  function daysForSelection() {
    return combineDays();
  }
  function visibleItineraries() {
    return [activeItinerary];
  }
  function visibleStays() {
    return visibleItineraries().reduce(function (stays, itinerary) { return stays.concat(itinerary.stays); }, []);
  }
  function visibleShipments() {
    var seen = {};
    return TRIP.itineraries.reduce(function (shipments, itinerary) {   /* everyone sees every shipment (one shared view) */
      (itinerary.shipments || []).forEach(function (shipment) {
        if (!seen[shipment.id]) { seen[shipment.id] = true; shipments.push(shipment); }
      });
      return shipments;
    }, []);
  }
  function visibleEmergency() {
    var seen = {};
    return visibleItineraries().reduce(function (contacts, itinerary) {
      (itinerary.emergency || TRIP.emergency).forEach(function (contact) {
        var key = contact.number;
        if (!seen[key]) { seen[key] = true; contacts.push(contact); }
      });
      return contacts;
    }, []);
  }
  var DAYS = daysForSelection();
  function readStoredObject(key) {
    try {
      var value = localStorage.getItem(key);
      return value ? JSON.parse(value) : {};
    } catch (e) {
      console.error("Could not read saved trip tracking data.", e);
      return {};
    }
  }
  function writeStoredObject(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { console.error("Could not save trip tracking data.", e); }
  }
  function shipmentStorageKey() { return "tripShipments"; }
  function shipmentState() { return readStoredObject(shipmentStorageKey()); }
  function saveShipment(shipmentId, field, value) {
    var state = shipmentState();
    state[shipmentId] = state[shipmentId] || {};
    state[shipmentId][field] = value;
    writeStoredObject(shipmentStorageKey(), state);
  }

  /* ================= 1. Dates (all as "YYYY-MM-DD" text, never parsed as local time) ================= */

  /* Today's date in Japan, e.g. "2026-12-23". en-CA happens to format dates as YYYY-MM-DD. */
  function todayInJapan() { return L.todayInJapan(); }   /* tested in tests/logic.test.js */
  /* Which day to open on: before the trip → day 1, after it → the last day, during it → today.
     Plain text comparison works because the dates are all YYYY-MM-DD. */
  function openingDate(today) {
    var first = DAYS[0].date, last = DAYS[DAYS.length - 1].date;
    if (today < first) return first;
    if (today > last) return last;
    return today;
  }
  var WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  /* Split "2026-12-23" into numbers and work out the weekday in UTC, so the phone's own time zone can't shift it. */
  function dateParts(iso) {
    var p = iso.split("-").map(Number);
    return { y: p[0], m: p[1], d: p[2], wd: new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay() };
  }
  function longDate(iso) {   /* "Wednesday 23 December" */
    var p = dateParts(iso);
    return WEEKDAYS[p.wd] + " " + p.d + " " + MONTHS[p.m - 1];
  }
  function dayIndex(iso) {
    for (var i = 0; i < DAYS.length; i++) if (DAYS[i].date === iso) return i;
    return -1;
  }

  /* ---------- Sky, sun and moon: everything follows the SUN ----------
     The time in Japan (minutes since midnight; Japan is always UTC+9) sets where the sun is.
     The sky colours, stars and lit windows are worked out from the sun's height, so the sky
     can never disagree with the sun: sun up = day sky, near the horizon = sunrise tint (right,
     rising) or sunset tint (left, setting), below the horizon = night, stars, windows lit, moon up. */
  var SKY_STATES = ["morning", "day", "dusk", "night"];
  var testMinutes = null;   /* checks only: set a number to pretend it's that time in Japan */
  function japanMinutes() {   /* minutes since midnight in Japan (with seconds, so the lapse is smooth) */
    if (typeof testMinutes === "number") return testMinutes;
    var now = new Date();
    return ((now.getUTCHours() + 9) % 24) * 60 + now.getUTCMinutes() + now.getUTCSeconds() / 60;
  }
  var SUNRISE = 330, SUNSET = 1080;   /* 5:30am and 6pm: the sun is up for 750 minutes, down for 690 */
  /* Where the sun is at minute m: phase 0 = rising on the right, ~0.5 = highest, 1 = setting on the left.
     Height runs from +1 (top of the sky) through 0 (horizon) to -1 (lowest, middle of the night). */
  function sunAt(m) {
    var sinceRise = ((m - SUNRISE) % 1440 + 1440) % 1440;
    var dayLen = SUNSET - SUNRISE;
    if (sinceRise < dayLen) {
      var t = sinceRise / dayLen;
      return { up: true, t: t, height: Math.sin(Math.PI * t), rising: t < 0.5 };
    }
    var n = (sinceRise - dayLen) / (1440 - dayLen);   /* 0 at sunset → 1 at the next sunrise */
    return { up: false, t: n, height: -Math.sin(Math.PI * n), rising: n > 0.5 };
  }
  function smooth(x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }
  /* Sky layer strengths (0..1) for minute m, from the sun's height alone. */
  function skyMix(m) {
    var s = sunAt(m);
    var night = 1 - smooth((s.height + 0.25) / 0.35);           /* fully night once the sun is 0.25 below the horizon */
    var glow = (1 - smooth(Math.abs(s.height - 0.1) / 0.5)) * (1 - night);   /* pink/orange near the horizon */
    return { night: night, morning: s.rising ? glow : 0, dusk: s.rising ? 0 : glow, sun: s };
  }
  /* The resting sky "state" (used for text colour and a few night-only touches): the strongest layer. */
  function skyState(m) {
    var x = skyMix(m);
    if (x.night >= 0.5) return "night";
    if (Math.max(x.morning, x.dusk) >= 0.5) return x.morning > x.dusk ? "morning" : "dusk";
    return "day";
  }
  function skyStateInJapan() { return skyState(japanMinutes()); }

  /* The sun and moon ride one smooth arc across the postcard: they rise on the RIGHT and set on the LEFT.
     t = 0 is the right horizon, 0.5 the top of the arc, 1 the left horizon (a quadratic curve, in the
     postcard picture's 390 × 190 coordinates). */
  function arcPoint(t) {
    var u = 1 - t;
    return [u * u * 372 + 2 * u * t * 195 + t * t * 18,    /* x: from 372 (right) to 18 (left) */
            u * u * 172 + 2 * u * t * 18 + t * t * 172];   /* y: from the horizon up to ~95, then back down */
  }
  /* Where the sun and moon are at minute m: the moon crosses while the sun is down (null = hidden). */
  function bodiesAt(m) {
    var s = sunAt(m);
    return s.up ? { sun: s.t, moon: null } : { sun: null, moon: s.t };
  }
  function restingBodies() { return bodiesAt(japanMinutes()); }
  /* Put a sun/moon circle at point t of the arc (null = hidden below the horizon). */
  function bodyAttrs(t) {
    if (t === null) return 'opacity="0" transform="translate(195 260)"';
    var p = arcPoint(t);
    return 'transform="translate(' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ')"';
  }
  function placeBody(el, t) {
    var p = arcPoint(t === null ? 0.5 : t);
    el.setAttribute("transform", "translate(" + p[0].toFixed(1) + " " + (t === null ? 260 : p[1].toFixed(1)) + ")");
    if (t === null) el.setAttribute("opacity", "0"); else el.removeAttribute("opacity");
  }
  /* style="opacity:…" text for a sky layer at rest, so the page is drawn by the same maths as the lapse. */
  function op(v) { return ' style="opacity:' + v.toFixed(3) + '"'; }
  function skyLayers() {   /* the three tint layers over the day sky, at their strength for right now */
    var x = skyMix(japanMinutes());
    return '<div class="sky sky-morning"' + op(x.morning) + '></div><div class="sky sky-dusk"' + op(x.dusk) + '></div>' +
      '<div class="sky sky-night"' + op(x.night) + '></div>';
  }

  /* ---------- The day-change time-lapse: one clock, one full day ----------
     The lapse fast-forwards exactly 24 hours of Japan time, starting and ending at "now", over LAPSE_MS.
     Every frame turns elapsed time into a minute of the day and draws the sun, moon, sky, stars and
     lit windows for that minute (all from the sun's position), so they always move together. */
  var LAPSE_MS = 2200;
  function ease(x) { return x * x * (3 - 2 * x); }   /* gentle start and stop */
  var FOCUS = [[0, 0], [0.12, 0.1], [0.35, 0], [1, 0]];   /* focus lines: one faint, slow swell at the start */
  function focusAt(u) {
    for (var k = 1; k < FOCUS.length; k++) if (u <= FOCUS[k][0]) {
      var a = FOCUS[k - 1], b = FOCUS[k];
      return a[1] + (b[1] - a[1]) * ease((u - a[0]) / (b[0] - a[0]));
    }
    return 0;
  }
  /* Draw the lapse at moment u (0..1). At u = 0 and u = 1 this is exactly the resting picture. */
  function drawLapse(st, u) {
    var m = st.m0 + 1440 * ease(u);
    var x = skyMix(m), b = bodiesAt(m);
    st.skies.dusk.style.opacity = x.dusk;

  var FORECASTS = {};   /* city key → Open-Meteo "daily" data, filled once on load */
  function dayWeather(day) {
    return day.weather.map(function (key) {
      var c = TRIP.cities[key], w = L.pickWeather(c, day.date, FORECASTS[key]);
      return { key: key, name: c.name, hi: w.hi, lo: w.lo, live: w.live, rain: w.rain };

  /* One fetch per city on app open; if there's no signal we just keep the typical temps. */
  function loadForecasts() {

      var c = TRIP.cities[key];
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + c.lat + "&longitude=" + c.lon +

  /* The day's highest live chance of rain across its cities, or 0 when there's no live forecast yet. */

    '<svg viewBox="0 0 64 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="23" cy="17" r="8" fill="var(--sun)"/>' +

    '</svg>';
  var SNOW_CLOUD_ICON =
    '<svg viewBox="0 0 64 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +

  var SCENE_LABELS = { tokyo: "Tokyo", osaka: "Osaka", kyoto: "Kyoto", hiroshima: "Hiroshima", sapporo: "Sapporo", jeju: "Jeju", busan: "Busan", seoul: "Seoul", air: "Flying" };

  /* The stars: part of each day's sliding sky (this picture also sets the height of the scene area). */
  function skySvg() {
    return '<svg class="sky-svg" viewBox="0 0 390 190" aria-hidden="true">' +
      '<g class="stars" fill="var(--moon)"' + op(skyMix(japanMinutes()).night) + '><circle cx="40" cy="30" r="1.5"/><circle cx="95" cy="70" r="1.2"/><circle cx="140" cy="22" r="1.5"/><circle cx="235" cy="60" r="1.2"/><circle cx="290" cy="25" r="1.5"/><circle cx="355" cy="55" r="1.2"/></g>' +
    '</svg>';

  /* The sun and moon, drawn at their arc positions. They sit on the fixed layer, so they don't slide with a drag. */
  function bodiesSvg() {
    var b = restingBodies();
    return '<svg class="bodies-svg" viewBox="0 0 390 190" aria-hidden="true">' +
      '<circle class="moon" r="15" fill="var(--moon)" ' + bodyAttrs(b.moon) + '/>' +
      '<circle class="sun" r="20" fill="var(--sun)" ' + bodyAttrs(b.sun) + '/>' +

  /* The city's landmarks (and its snow). These stay put while you drag between days. */
  var INK = '<g fill="none" stroke="var(--accent)" stroke-linecap="round" stroke-linejoin="round"';   /* the red pen */
  function landmarksHtml(name) {
    var c = SCENES[name];
    return snowHtml(name) + '<svg viewBox="0 0 390 190" aria-hidden="true">' +
      '<filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>' +
      /* the "sketch" filter gives the landmarks a slight hand-drawn wobble (kept gentle so lines stay crisp) */
      '<filter id="sketch"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1"/><feDisplacementMap in="SourceGraphic" scale="0.9"/></filter>' +
      '<filter id="loose"><feTurbulence type="fractalNoise" baseFrequency="0.07" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>' +   /* a wobblier copy: the faint first pencil line */
      '<filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="1.2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +   /* soft halo for night windows */
      (c.back || "") +
      '<g fill="var(--scene-far)" opacity="0.75" filter="url(#wobble)">' + c.far + '</g>' +
      '<g fill="var(--scene-near)" opacity="0.45" filter="url(#sketch)">' + (c.mid || "") + '</g>' +
      '<g fill="var(--scene-near)" filter="url(#sketch)">' + (c.near || "") + '</g>' +
      lights(c.lights) +
      '<path ' + (name === "air" ? 'class="cloudsea" ' : '') + 'd="M-5 190 V168 Q70 150 160 166 Q250 180 395 160 V190Z" fill="' + (c.ground || "var(--scene-hill)") + '" filter="url(#wobble)"/>' +
      (c.front || "") +
      INK + ' opacity="0.4" stroke-width="0.7" filter="url(#loose)">' + c.ink + '</g>' +
      INK + ' stroke-width="1.6" filter="url(#sketch)">' + c.ink + '</g>' +
    '</svg>';
  }

  /* Anime-style "kira" shine: a thin cross-shaped glint with two tiny dots */
  var KIRA = '<span class="kira" aria-hidden="true"><svg viewBox="0 0 20 20" fill="var(--sun)">' +
    '<path d="M10 0 Q10.8 9.2 20 10 Q10.8 10.8 10 20 Q9.2 10.8 0 10 Q9.2 9.2 10 0Z"/>' +
    '<circle cx="17" cy="3.5" r="1.3"/><circle cx="3.5" cy="16.5" r="0.9"/></svg></span>';
  /* Snowflakes: each is [left %, start delay in seconds, seconds to fall] */
  var FLAKES = [[8, 0, 9], [24, 3, 11], [41, 1.5, 8], [58, 5, 12], [73, 2.5, 10], [90, 6, 9]];
  var MORE_FLAKES = [[3, 1, 7], [15, 4.5, 8], [19, 0.5, 9], [32, 2, 7.5], [36, 6, 8.5], [49, 3.5, 7], [53, 0.8, 9.5], [66, 4, 8], [81, 1.2, 7.5], [85, 5.5, 9], [96, 2.8, 8]];
  function snowHtml(scene) {   /* light snow everywhere, heavy in Sapporo, none above the clouds */
    if (scene === "air" || scene === "jeju" || scene === "busan" || scene === "seoul") return "";
    /* The delay counts from page load (a negative delay = already partway through), so after a re-render
       the flakes carry on where they were instead of all jumping back to the top. */
    var t = performance.now() / 1000;
    return '<div class="snow" aria-hidden="true">' + (scene === "sapporo" ? FLAKES.concat(MORE_FLAKES) : FLAKES).map(function (f) {
      return '<i style="left:' + f[0] + '%;animation-delay:' + (f[1] - t).toFixed(2) + 's;animation-duration:' + f[2] + 's"></i>';
    }).join("") + '</div>';
  }

  /* Split "Off We Go! ✈️" into the words and the trailing emoji, so the emoji skips the outline. */
  function funTitle(title) {
    var m = title.match(/^(.*?)\s*((?:\p{Extended_Pictographic}|️|‍)+)$/u);
    var words = m ? m[1] : title, emoji = m ? m[2] : "";
    var cut = words.lastIndexOf(" ") + 1;   /* the last word and the emoji stay together if the title wraps */
    return '<div class="funtitle">' + esc(words.slice(0, cut)) + '<span class="nw">' + esc(words.slice(cut)) +
      (emoji ? ' <span class="emoji">' + emoji + '</span>' : '') + KIRA + '</span></div>';
  }

  /* ================= 5. Pages ================= */
  var isLarge = false;

  /* The control bar. The middle button is always text size; the outer two change per page. */
  function bar(left, right) {
    return '<div class="bar">' + left +
      '<button type="button" data-act="size" aria-pressed="' + isLarge + '">Aa ' + (isLarge ? "Large" : "Normal") + '</button>' +
      right + '</div>';

  var BTN_CAL = '<button type="button" data-act="cal">Calendar</button>';
  var BTN_HELP = '<button type="button" data-act="help">Help &amp; phrases</button>';

  /* One day's sliding header: its sky colours, stars, day number, date, cities, fun title and weather.
     The page shows today's slide, with yesterday's and tomorrow's parked either side for the drag. */
  function slide(i, where, topBar) {
    var day = DAYS[i], weather = dayWeather(day);
    var spacer = topBar.replace(/ data-act="[^"]*"/g, "").replace('class="bar"', 'class="bar bar-spacer"');
    return '<div class="slide ' + where + '"' + (where === "cur" ? '' : ' aria-hidden="true"') + '>' +
        skyLayers() +
        '<div class="pc-top">' + spacer +
          '<div class="daytitle"><div class="eyebrow">Day ' + (i + 1) + '</div>' + (where === "cur" ? '<h1>' : '<div class="h1" role="presentation">') +
            longDate(day.date) + (where === "cur" ? '</h1>' : '</div>') +
            '<div class="eyebrow">' + weather.map(function (w) { return esc(w.name); }).join(" → ") + '</div></div>' +
          funTitle(day.title) +

      '</div>';

  /* The day's to-dos and things to bring (Sheet columns L and M). Umbrellas and cash are added automatically. */
  /* Who each Do/Bring item is for. The day's list belongs to before.who (from the Sheet's "Who" column, e.g. "Darryl & Josie",
     "Hiroshima crew", "Everyone"); an item starting "(Darryl & Josie) ..." in the Sheet belongs to that group instead.
     Matt & Chloe's own lists (from their tab) always sit under "Matt & Chloe". */
  function splitByWho(items, defaultWho, groups, kind) {
    (items || []).forEach(function (text) {
      var m = /^\(([^)]+)\)\s*(.+)$/.exec(text);
      var who = m ? m[1] : defaultWho;
      if (!groups[who]) groups[who] = { do: [], bring: [] }, groups.order.push(who);
      groups[who][kind].push(m ? m[2] : text);
    });
  }
  function beforeBox(day, weather) {
    var b = day.before || {}, rain = rainChance(weather);
    var mainWho = day.mattChloeOnly ? "Matt & Chloe" : (b.who || "Everyone");
    var groups = { order: [] };
    groups[mainWho] = { do: [], bring: [] }; groups.order.push(mainWho);
    splitByWho(b.do, mainWho, groups, "do");
    splitByWho(b.bring, mainWho, groups, "bring");
    if (rain >= 50) groups[mainWho].bring.unshift("☂️ Umbrellas (" + rain + "% rain)");
    if (!day.mattChloeOnly) groups[mainWho].bring.push("💴 Cash: at least ¥10,000 in your wallet");   /* yen: Japan days only */
    var mc = day.mattChloeBefore;
    if (mc) { splitByWho(mc.do, "Matt & Chloe", groups, "do"); splitByWho(mc.bring, "Matt & Chloe", groups, "bring"); }
    function list(items) { return '<ul>' + items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>'; }
    if (!groups.order.some(function (who) { return groups[who].do.length || groups[who].bring.length; })) return "";   /* nothing to do or bring: no box */
    return '<div class="before"><h3>Before you head out</h3>' + groups.order.map(function (who) {
      var g = groups[who];
      return (g.do.length ? '<div class="lbl">DO · ' + esc(who) + '</div>' + list(g.do) : '') +
             (g.bring.length ? '<div class="lbl">BRING · ' + esc(who) + '</div>' + list(g.bring) : '');
    }).join("") + '</div>';
  }

  /* Their ragdoll, sitting on the cross bar between them (cell coords). White with grey ears, a grey mask round

  var RAGDOLL = '<g fill="none" stroke="var(--fig-line)" stroke-width="0.8" transform="translate(55 51.2) scale(0.92)">' +
    '<path d="M0.2 10 Q-0.8 12 -0.4 14 Q-1.5 15.5 -0.6 17 Q-1.7 18.6 -0.5 20.2 Q-0.7 22.8 1.6 23.2 Q3.9 22.8 3.7 20.2 Q4.9 18.6 3.8 17 Q4.8 15.4 3.6 14 Q4.2 12 3 10Z" fill="#8c7b75"/>' +   /* fluffy tail */
    '<path d="M1.3 15.2 l0.3 1.2 M2 18.6 l-0.2 1.2" stroke="#6e605a" stroke-width="0.45"/>' +   /* fur tufts */
    '<path d="M-3.3 2.4 Q-5.2 9 -3.4 10.5 H3.4 Q5.2 9 3.3 2.4Z" fill="#fffdf8"/>' +              /* body */
    '<path d="M-1.6 5 l0.8 1 l0.8 -1 l0.8 1 l0.8 -1" stroke-width="0.5"/>' +                     /* fluffy chest */
    '<path d="M-3.7 -1.3 L-3.5 -5 L-0.9 -3.2Z M3.7 -1.3 L3.5 -5 L0.9 -3.2Z" fill="#8c7b75"/>' +   /* grey ears */
    '<ellipse cx="0" cy="0" rx="4" ry="3.5" fill="#fffdf8"/>' +
    '<path d="M-3.3 -1.4 Q-2 -3.1 -0.5 -2.5 Q-0.5 0.5 -2.1 0.8 Q-3.6 0.4 -3.3 -1.4Z M3.3 -1.4 Q2 -3.1 0.5 -2.5 Q0.5 0.5 2.1 0.8 Q3.6 0.4 3.3 -1.4Z" fill="#a89b94" stroke="none"/>' +
    '<circle cx="-1.7" cy="-0.6" r="0.6" fill="#3f7fd0" stroke="none"/><circle cx="1.7" cy="-0.6" r="0.6" fill="#3f7fd0" stroke="none"/>' +
    '<path d="M-0.5 0.9 H0.5 L0 1.6Z" fill="#e58f8f" stroke="none"/></g>';

  /* Sis and Dan, locked up in a cell that peeks up from the bottom of every page (they're not on the trip). */
  function jailHtml() {
    var back = '<svg class="jail-back" viewBox="0 0 110 100" aria-hidden="true" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="4" y="12" width="102" height="90" fill="var(--card)"/>' +                                 /* back wall */
      '<rect x="48" y="17" width="14" height="11" fill="var(--paper)" stroke-width="1.4"/><path d="M52.7 17 V28 M57.3 17 V28" stroke-width="1.2"/>' +   /* little barred window */
      '<path d="M9 18 v6 M11.5 18 v6 M14 18 v6 M16.5 18 v6 M7.5 22.5 L18 19.5" stroke="var(--ink-soft)" stroke-width="0.9"/>' +   /* tally marks */
      '<g fill="var(--ink-soft)" stroke="none" font-size="5.5" font-weight="800" font-family="Figtree, sans-serif" text-anchor="middle">' +
        '<text x="34.5" y="27">SIS</text><text x="75.5" y="27">DAN</text></g>' +                            /* chalk names */
      '</svg>';

      '<path d="M2 12 H108" stroke-width="3.5"/>' +
      '<path d="M10 12 V100 M21 12 V100 M49 12 V100 M61 12 V100 M89 12 V100 M100 12 V100"/>' +

  function dayPage(i) {
    var day = DAYS[i];

    var hasMum = day.cards.some(function (c) { return c.people.indexOf("mum") !== -1; });
    var many = day.cards.length > 1;
    var groupCounts = {};

        '<div class="stage">' +
          '<div class="track" id="track">' + (i > 0 ? slide(i - 1, "prev", topBar) : '') + slide(i, "cur", topBar) +
            (i < DAYS.length - 1 ? slide(i + 1, "next", topBar) : '') + '</div>' +
          '<div class="bodies">' + bodiesSvg() + '</div>' +
          '<div class="landmarks" id="landmarks">' + landmarksHtml(day.scene) + '</div>' +
          '<div class="focus"></div>' +
          '<div class="bar-float">' + topBar + '</div>' +
        '</div>' +
        '<div class="pc-caption">' +
          '<p><strong>What to wear:</strong> ' + wearFor(weather) + '</p>' +

        day.cards.map(function (c, k) { return groupPanel(c, k, day.date, groupCounts[c.people.slice().sort().join(",")] > 1); }).join("") + '</div>';
  }

  /* Calendar: Monday first; only dates in the current itinerary view are tappable. */
  var WD_SHORT = ["M", "T", "W", "T", "F", "S", "S"];
  function monthGrid(y, m) {
    var lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;   /* blank cells before the 1st (Monday-first) */
    var daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var today = todayInJapan();
    var html = WD_SHORT.map(function (w) { return '<div class="wd" aria-hidden="true">' + w + '</div>'; }).join("");
    for (var b = 0; b < lead; b++) html += '<div class="tile blank"></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var iso = y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      var i = dayIndex(iso);
      if (i === -1) { html += '<div class="tile off"><span class="tnum">' + d + '</span></div>'; continue; }
      var day = DAYS[i], sticker = STICKERS[iso];
      var words = day.title.replace(/[\s\p{Extended_Pictographic}️‍]+$/u, "");   /* title without its emoji */
      html += '<a class="tile' + (iso === today ? " today" : iso < today ? " past" : "") + (sticker ? " special" : "") + '" href="#day-' + iso + '"' +
        ' aria-label="' + esc(longDate(iso) + ", " + SCENE_LABELS[day.scene] + ": " + day.title) + '">' +
        (iso === today ? '<i class="tape"></i>' : '') + (sticker ? '<span class="sticker" aria-hidden="true">' + sticker + '</span>' : '') +
        '<span class="tnum">' + d + '</span>' + miniIcon(day.scene) + '<span class="tcity">' + SCENE_LABELS[day.scene] + '</span>' +
        '<span class="ttitle">' + esc(words) + '</span></a>';
    }
    return '<section class="section month"><h2>' + MONTHS[m - 1] + ' ' + y +
      ' <span class="sfx" lang="ja" aria-hidden="true">' + m + '月</span></h2><div class="cal">' + html + '</div></section>';
  }
  var STICKERS = { "2026-12-18": "🎂", "2026-12-25": "🎄", "2026-12-31": "🎆" };   /* special days get a tilted sticker */

  /* Calendar tiles are narrow: shrink a city name or title only if one of its words doesn't fit. */
  function fitTiles() {
    var els = document.querySelectorAll(".tcity, .ttitle");
    for (var n = 0; n < els.length; n++) {
      var el = els[n];
      el.style.fontSize = "";
      var size = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth + 0.5 && size > 6) { size *= 0.92; el.style.fontSize = size + "px"; }
    }
  }
  function fitAll() { fitTitle(); fitTiles(); }
  function calendarPage() {
    var first = DAYS[0].date, last = DAYS[DAYS.length - 1].date;
    var start = dateParts(first), end = dateParts(last), months = [];
    var y = start.y, m = start.m;
    while (y < end.y || (y === end.y && m <= end.m)) {
      months.push(monthGrid(y, m));
      m++;
      if (m > 12) { m = 1; y++; }

    return '<header class="plainhead">' + bar('<button type="button" data-act="today">Today</button>', BTN_HELP) +
      '<h1>' + esc(title) + '</h1><div class="eyebrow">' + esc(longDate(first)) + ' ' + start.y + ' – ' + esc(longDate(last)) + ' ' + end.y + ' · tap a day</div></header>' +
      months.join("");
  }

  /* Help & phrases. Numbers are tel: links; the address and phrase buttons open the huge view. */
  function telHref(n) { return "tel:" + n.replace(/[^\d+]/g, ""); }

  function helpPage() {
    var shipmentData = shipmentState();
    var shipments = visibleShipments();
    var emergency = visibleEmergency();
    var stays = visibleStays();
    var shipmentHtml = shipments.map(function (shipment) {
      var state = shipmentData[shipment.id] || {};
      var groupNames = (shipment.groupIds || []).map(function (groupId) {
        for (var i = 0; i < TRIP.itineraries.length; i++) {
          var group = TRIP.itineraries[i].groups.filter(function (item) { return item.id === groupId; })[0];
          if (group) return group.name;
        }
        return "";
      }).filter(function (name) { return !!name; });
      return '<div class="tracking-item"><strong>' + esc(shipment.label) + '</strong>' +
        '<div class="note">' + esc(shipment.carrier) + ' · Sent: ' + esc(shipment.sent) + ' · Expected: ' + esc(shipment.expected) +
          (groupNames.length ? ' · Groups: ' + esc(groupNames.join(", ")) : '') + '</div>' +
        '<div class="tracking-fields">' +
          '<label>Tracking number<input type="text" inputmode="text" autocomplete="off" data-shipment="' + esc(shipment.id) + '" data-track-field="number" value="' + esc(state.number || "") + '"></label>' +
          '<label>Status<select data-shipment="' + esc(shipment.id) + '" data-track-field="status">' +
            ["Not sent", "Sent", "In transit", "Ready for collection", "Collected"].map(function (status) {

            }).join("") + '</select></label>' +
        '</div></div>';
    }).join("");
    return '<header class="plainhead">' + bar(BTN_CAL, '<button type="button" data-act="back">Back to day</button>') +
      '<h1>Help &amp; phrases</h1></header>' +
      '<section class="section"><h2>Emergency</h2>' + emergency.map(function (e) {
        return '<div class="row"><span>' + esc(e.label) + '</span><a class="tel" href="' + telHref(e.number) + '">' + esc(e.number) + '</a></div>';
      }).join("") + '</section>' +
      '<section class="section"><h2>Luggage tracking</h2>' +
        (shipments.length ? shipmentHtml + '<p class="tracking-note">Tracking numbers and statuses are saved only in this browser on this device.</p>' : '<p>No luggage shipments are listed for this itinerary.</p>') +
      '</section>' +
      '<section class="section"><h2>Where we stay</h2>' + activeItinerary.stays.map(function (s, k) {
        return '<div class="stay"><div class="eyebrow">' + esc(s.city) + ' · ' + esc(s.dates) + '</div>' +
          '<div><strong>' + esc(s.name) + '</strong></div>' + (s.en ? '<div>' + esc(s.en) + '</div>' : '') +
          (s.ja ? '<div class="ja" lang="ja">' + esc(s.ja) + '</div><button type="button" class="btn btn-google" data-act="taxi" data-i="' + k + '">Show taxi driver</button>' : '') + '</div>';
      }).join("") + '</section>' +
      '<section class="section"><h2>Japan how-tos</h2>' + TRIP.howtos.map(function (h) {
        return '<details class="howto"><summary>' + esc(h.q) + '</summary><ul>' + h.a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></details>';
      }).join("") + '</section>' +
      '<section class="section"><h2>Phrases</h2><p class="note">Tap one to show it big.</p>' + TRIP.phrases.map(function (p, k) {
        return '<button type="button" class="phrase" data-act="phrase" data-i="' + k + '">' +
          '<span class="ja" lang="ja">' + esc(p.ja) + '</span><span class="say">' + esc(p.say) + '</span><span class="en">' + esc(p.en) + '</span></button>';
      }).join("") + '</section>';
  }

  /* Matt's banner: a banknote with faint money patterns, "100" in each corner, and sparkles.
     Each sparkle is [left %, top %, size in rem, animation delay in seconds]. */
  var SPARKLES = [[-3, -18, 1.4, 0], [12, 88, 1, 0.3], [30, -22, 1, 0.6], [50, 94, 1.5, 0.15], [68, -20, 1.2, 0.45], [88, 90, 1, 0.7],
                  [99, -12, 1.5, 0.25], [-4, 60, 1.1, 0.5], [100, 45, 1.2, 0.05], [22, 28, 0.8, 0.4], [76, 58, 0.9, 0.65], [48, -8, 0.8, 0.2]];
  var BILL_ART =
    '<svg class="bill-art" viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke="var(--bill-ink)">' +
      '<rect x="7" y="7" width="286" height="106" rx="3" stroke-dasharray="2 3"/>' +
      '<ellipse cx="150" cy="60" rx="66" ry="38"/><ellipse cx="150" cy="60" rx="80" ry="44"/><ellipse cx="150" cy="60" rx="94" ry="50"/>' +
      '<circle cx="36" cy="60" r="24"/><circle cx="36" cy="60" r="19"/><circle cx="264" cy="60" r="24"/><circle cx="264" cy="60" r="19"/>' +
      '<g fill="var(--bill-ink)" stroke="none" font-size="28" font-family="Georgia, serif" text-anchor="middle"><text x="36" y="70">$</text><text x="264" y="70">$</text></g>' +
    '</svg>';
  function bannerHtml() {
    var sparkles = SPARKLES.map(function (sp) {
      return '<i class="sparkle" style="left:' + sp[0] + '%;top:' + sp[1] + '%;width:' + sp[2] + 'rem;height:' + sp[2] + 'rem;animation-delay:' + sp[3] + 's"></i>';
    }).join("");
    return '<span class="bill">' + BILL_ART +
      '<b class="corner c1">100</b><b class="corner c2">100</b><b class="corner c3">100</b><b class="corner c4">100</b>' +
      '<span class="bill-text">Thank you Matt for covering all expenses today! 🙏</span></span>' + sparkles;
  }

  /* ================= 6. Wiring: routing, banner, text size, swipes, huge view ================= */
  var app = document.getElementById("app");
  var matt = document.getElementById("matt");
  var big = document.getElementById("big");
  var mattTimer;
  var current = { view: "", i: 0 };   /* what's on screen now */
  var lastDay = 0;                    /* the day "Back to day" returns to */

  /* Read the address bar: #day-2026-12-23, #calendar or #help. Anything else → the opening day. */
  function route() {
    var h = location.hash.slice(1);
    if (h === "calendar" || h === "help") return { view: h };
    var i = h.indexOf("day-") === 0 ? dayIndex(h.slice(4)) : -1;
    if (i === -1) i = dayIndex(openingDate(todayInJapan()));
    return { view: "day", i: i };
  }

  function render() {
    var r = route();
    current = r;
    closeBig();
    var lapseFrom = pendingLapse;
    pendingLapse = null;
    if (r.view === "calendar") { app.innerHTML = calendarPage() + jailHtml(); fitTiles(); }
    else if (r.view === "help") app.innerHTML = helpPage() + jailHtml();
    else {
      lastDay = r.i;
      app.innerHTML = dayPage(r.i) + jailHtml();
      fitTitle();
      wirePager(DAYS[r.i]);
      if (lapseFrom) startLapse(lapseFrom);
    }
    window.scrollTo(0, 0);
  }

  /* After a day change: the sky time-lapses through the night, and the old city's landmarks
     swap for the new city's at the darkest moment (when the sun is lowest). */
  var pendingLapse = null;   /* { scene, node }: the old day's landmarks, saved just before a swipe re-renders the page */
  var lapseUntil = 0;        /* time the current lapse ends (so a late forecast redraw doesn't cut it off) */
  function startLapse(from) {
    lapseUntil = Date.now() + LAPSE_MS + 200;
    var pc = document.querySelector(".postcard"), cur = document.querySelector(".slide.cur");
    var newScene = DAYS[current.i].scene;
    /* Put the OLD landmarks element (already painted) back in place of the new one, so nothing
       changes on screen until the lapse swaps it at the darkest moment. */
    var lm = document.getElementById("landmarks");
    lm.replaceWith(from.node);
    lm = from.node;
    var snow = lm.querySelector(".snow");   /* moving an element restarts its CSS animations: re-sync the flakes to the clock */
    if (snow) snow.outerHTML = snowHtml(from.scene);
    var bodies = document.querySelector(".bodies-svg");
    var st = {
      m0: japanMinutes(),   /* the lapse runs from now, round a full day, back to now */
      skies: { dusk: cur.querySelector(".sky-dusk"), night: cur.querySelector(".sky-night"), morning: cur.querySelector(".sky-morning") },
      stars: cur.querySelector(".stars"), landmarks: lm, focus: pc.querySelector(".focus"),
      sun: bodies.querySelector(".sun"), moon: bodies.querySelector(".moon")
    };
    /* The darkest moment is when the sun is lowest (middle of the night, 11:45pm). Swap the landmarks
       when the lapse reaches it, however far into the lapse that is. */
    var DARKEST = SUNSET + (1440 - (SUNSET - SUNRISE)) / 2;
    var untilDarkest = ((DARKEST - st.m0) % 1440 + 1440) % 1440;
    var swapped = from.scene === newScene, done = false, start = null;
    function step(u) {
      if (done || !pc.isConnected) return;   /* finished, or the page changed underneath us */
      if (!swapped && 1440 * ease(u) >= untilDarkest) { lm.innerHTML = landmarksHtml(newScene); swapped = true; }
      drawLapse(st, u);
      if (u >= 1) { done = true; st.focus.style.opacity = ""; }   /* u = 1 is the resting picture again */
    }
    function frame(now) {
      if (start === null) start = now;
      step(Math.min(1, (now - start) / LAPSE_MS));
      if (!done && pc.isConnected) requestAnimationFrame(frame);
    }
    step(0);   /* u = 0 is exactly what's on screen now, so there's nothing to flash */
    requestAnimationFrame(frame);
    setTimeout(function () { step(1); }, LAPSE_MS + 200);   /* if frames stopped (app in background), still end cleanly */
  }

  /* The "1 of 2 · name" indicator follows the sideways card scroll. */
  function wirePager(day) {
    if (day.cards.length < 2) return;
    var panels = document.getElementById("panels");
    panels.addEventListener("scroll", function () {
      if (!panels.isConnected) return;   /* a late scroll event from a page that's already been replaced */
      var k = Math.min(day.cards.length - 1, Math.round(panels.scrollLeft / panels.firstElementChild.offsetWidth));
      document.getElementById("pagerText").textContent = (k + 1) + " of " + day.cards.length + " · " + day.cards[k].name;
      var dots = document.querySelectorAll(".dots i");
      for (var d = 0; d < dots.length; d++) dots[d].className = d === k ? "on" : "";
    });
  }

  /* Long day titles: shrink the font a step at a time until the line fits. If it still doesn't fit at
     70% size, let it wrap onto two lines instead, so the hero title never gets tiny. */
  function fitTitle() {
    var els = document.querySelectorAll(".funtitle");   /* today's, plus the neighbours waiting either side */
    for (var n = 0; n < els.length; n++) fitOneTitle(els[n]);
  }
  function fitOneTitle(el) {
    el.style.fontSize = el.style.whiteSpace = "";
    var size = parseFloat(getComputedStyle(el).fontSize), floor = size * 0.7;
    var tooWide = function () { return el.scrollWidth > el.clientWidth + 1; };
    while (tooWide() && size > floor) { size *= 0.93; el.style.fontSize = size + "px"; }
    if (tooWide()) el.style.whiteSpace = "normal";   /* allow two lines */
    /* at most two lines (Large text wraps on its own): shrink a little more if it needs three */
    while ((el.offsetHeight > size * 1.1 * 2 + 4 || tooWide()) && size > floor * 0.75) { size *= 0.95; el.style.fontSize = size + "px"; }
  }

  function showBanner() {
    matt.innerHTML = bannerHtml();
    matt.classList.remove("gone", "pop");
    void matt.offsetWidth;          /* makes the browser notice the class was removed, so the pop animation restarts */
    matt.classList.add("pop");
    clearTimeout(mattTimer);
    mattTimer = setTimeout(hideBanner, 5000);
  }
  function hideBanner() { clearTimeout(mattTimer); matt.classList.add("gone"); }
  matt.addEventListener("click", hideBanner);

  function setLarge(on) {
    isLarge = on;
    document.documentElement.classList.toggle("large", on);
    var btns = document.querySelectorAll('[data-act="size"]');   /* the real bar and its invisible copies */
    for (var n = 0; n < btns.length; n++) { btns[n].textContent = "Aa " + (on ? "Large" : "Normal"); btns[n].setAttribute("aria-pressed", on); }
    try { localStorage.setItem("tripTextSize", on ? "large" : "normal"); } catch (e) { /* no storage: fine */ }
    fitAll();
  }

  /* The huge view: Japanese text big enough to hold up to a taxi driver or shop counter. */
  function openBig(html) {
    big.innerHTML = html + '<small>Tap anywhere to close</small>';
    big.hidden = false;
    big.focus();
  }
  function closeBig() { big.hidden = true; }
  big.tabIndex = -1;
  big.addEventListener("click", closeBig);
  document.addEventListener("change", function (e) {
    var target = e.target;
    if (target.matches("[data-shipment][data-track-field]")) {
      saveShipment(target.getAttribute("data-shipment"), target.getAttribute("data-track-field"), target.value);
    }
  });
  document.addEventListener("input", function (e) {
    var target = e.target;
    if (target.matches('[data-shipment][data-track-field="number"]')) {
      saveShipment(target.getAttribute("data-shipment"), "number", target.value);
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeBig();
    /* desktop: arrow keys change day, like a swipe */
    if (current.view === "day" && big.hidden && !(e.target.closest && e.target.closest("input, textarea"))) {
      if (e.key === "ArrowRight") changeDay(1);
      if (e.key === "ArrowLeft") changeDay(-1);
    }
  });

  /* One click listener for all the buttons render() creates. */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    var k = Number(btn.getAttribute("data-i"));
    if (act === "size") setLarge(!isLarge);
    if (act === "cal") location.hash = "#calendar";
    if (act === "help") location.hash = "#help";
    if (act === "today") location.hash = "#day-" + openingDate(todayInJapan());
    if (act === "back") location.hash = "#day-" + DAYS[lastDay].date;
    if (act === "taxi") {
      var s = visibleStays()[k];
      openBig('<div class="ja" lang="ja">この住所までお願いします</div><div class="ja" lang="ja">' + esc(s.ja) + '</div><div>' + esc(s.name) + '</div>');
    }
    if (act === "phrase") {
      var p = TRIP.phrases[k];
      openBig('<div class="ja" lang="ja">' + esc(p.ja) + '</div><div class="say">' + esc(p.say) + '</div><div>' + esc(p.en) + '</div>');
    }
  });

  /* ---------- Changing day ---------- */
  function reducedMotion() { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  /* Show day i. replaceState (not a new history entry) so swiping through days doesn't fill up the back button. */
  function goToDay(i, withLapse) {
    var oldLandmarks = document.getElementById("landmarks");
    pendingLapse = withLapse && !reducedMotion() && oldLandmarks ? { scene: DAYS[current.i].scene, node: oldLandmarks } : null;
    history.replaceState(null, "", "#day-" + DAYS[i].date);
    render();
  }
  /* Move the sliding header. ms = 0 follows the finger exactly; ms > 0 eases there. */
  function setTrack(x, ms) {
    var track = document.getElementById("track");
    if (!track) return;
    track.style.transition = ms ? "transform " + ms + "ms ease-out" : "none";
    track.style.transform = "translate3d(" + x + "px,0,0)";
  }
  var sliding = false;   /* true while the header glides to the next day, so a new drag can't interrupt */
  function slideToDay(step) {   /* step = +1 next day, -1 previous */
    var target = current.i + step;
    if (sliding || target < 0 || target >= DAYS.length) return;
    if (reducedMotion()) return goToDay(target, false);
    sliding = true;
    var track = document.getElementById("track"), finished = false;
    /* Swap pages only once the glide has really finished (transitionend), not on a guessed timer:
       on a slow phone the glide can run a frame late, and swapping early made the header jump. */
    var finish = function () {
      if (finished) return;
      finished = true;
      sliding = false;
      goToDay(target, true);
    };
    track.addEventListener("transitionend", function onEnd(e) {
      if (e.target !== track) return;   /* ignore transitions bubbling up from inside the header */
      track.removeEventListener("transitionend", onEnd);
      finish();
    });
    setTimeout(finish, 450);   /* safety net if transitionend never fires (e.g. already at the end) */
    setTrack(-step * track.offsetWidth, 220);
  }
  function changeDay(step) { slideToDay(step); }   /* arrow keys on a computer */

  /* ---------- Dragging the header between days (touch) ----------
     Single-card days: a sideways drag anywhere on the page moves the header.
     Split days: only on the postcard, because a sideways swipe on the cards moves between groups.
     We only take over once the finger is clearly moving sideways, so vertical scrolling still works. */
  var drag = null, panFrame = 0;
  document.addEventListener("touchstart", function (e) {
    drag = null;
    if (current.view !== "day" || !big.hidden || e.touches.length > 1 || sliding) return;
    if (DAYS[current.i].cards.length > 1 && !e.target.closest(".postcard")) return;
    var t = e.touches[0];
    drag = { x0: t.clientX, y0: t.clientY, dx: 0, dir: null, w: document.getElementById("track").offsetWidth,
             recent: [[t.clientX, e.timeStamp]] };   /* last few positions, to measure flick speed */
  }, { passive: true });

  document.addEventListener("touchmove", function (e) {
    if (!drag) return;
    var t = e.touches[0], dx = t.clientX - drag.x0, dy = t.clientY - drag.y0;
    if (!drag.dir) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;   /* too small to tell yet */
      drag.dir = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    }
    if (drag.dir === "y") { drag = null; return; }   /* vertical: leave it to the page scroll */
    e.preventDefault();                               /* sideways: it's ours, don't scroll */
    drag.dx = dx;
    drag.recent.push([t.clientX, e.timeStamp]);
    if (drag.recent.length > 5) drag.recent.shift();
    if (!reducedMotion() && !panFrame) panFrame = requestAnimationFrame(function () {   /* at most one move per screen frame */
      panFrame = 0;
      if (drag) setTrack(rubberBand(drag.dx), 0);
    });
  }, { passive: false });   /* passive: false, or preventDefault() is ignored */

  /* At the first/last day there's nothing to pull in, so the header only gives a little (rubber band). */
  function rubberBand(dx) {
    var target = current.i + (dx < 0 ? 1 : -1);
    return target < 0 || target >= DAYS.length ? dx / 4 : dx;
  }

  function endDrag() {
    var d = drag;
    drag = null;
    if (!d || d.dir !== "x") return;
    var step = d.dx < 0 ? 1 : -1, target = current.i + step;
    var a = d.recent[0], b = d.recent[d.recent.length - 1];
    var speed = (b[0] - a[0]) / Math.max(1, b[1] - a[1]);   /* pixels per millisecond */
    var flick = Math.abs(speed) > 0.5 && (speed < 0) === (d.dx < 0);
    var go = target >= 0 && target < DAYS.length && (Math.abs(d.dx) > d.w * 0.25 || flick);
    if (go) slideToDay(step);
    else if (!reducedMotion()) setTrack(0, 200);   /* not far enough: snap back */
  }
  document.addEventListener("touchend", endDrag, { passive: true });
  document.addEventListener("touchcancel", function () { if (drag && drag.dir === "x") setTrack(0, 200); drag = null; }, { passive: true });

  window.addEventListener("hashchange", render);
  window.addEventListener("resize", fitAll);
  if (document.fonts) document.fonts.ready.then(fitAll);   /* re-fit once Figtree has loaded */

  /* Start up */
  try { isLarge = localStorage.getItem("tripTextSize") === "large"; } catch (e) { /* no storage: fine */ }
  document.documentElement.classList.toggle("large", isLarge);
  if (route().view === "day" && location.hash.indexOf("#day-") !== 0) {
    history.replaceState(null, "", "#day-" + openingDate(todayInJapan()));   /* so the address shows the day */
  }
  render();
  showBanner();   /* once per app open/reload only (not on day changes) */
  /* Redraw with live temps once they arrive, but only if nobody's mid-use (scrolled, swiping, taxi view open).
     Otherwise the next day change picks them up anyway. */
  loadForecasts().then(function () {
    if (!drag && !sliding && big.hidden && window.scrollY < 10 && Date.now() > lapseUntil) render();
  });

  /* Tiny self-check (shows in the console only if something is wrong) */
  console.assert(openingDate("1900-01-01") === DAYS[0].date, "before the itinerary → first day");
  console.assert(openingDate(DAYS[0].date) === DAYS[0].date, "during the itinerary → today");
  console.assert(openingDate("2999-01-01") === DAYS[DAYS.length - 1].date, "after the itinerary → last day");
  console.assert(longDate("2026-12-23") === "Wednesday 23 December", "weekday maths");
  console.assert(wearFor([{ hi: -1, lo: -7 }]).indexOf("Freezing") === 0 && wearFor([{ hi: 12, lo: 3 }, { hi: 25, lo: 14 }]).indexOf("Cold") === 0, "wear rules use the colder city");
  console.assert(SKY_STATES.indexOf(skyStateInJapan()) !== -1, "unknown sky state");
  console.assert(arcPoint(0)[0] > 350 && arcPoint(1)[0] < 40 && arcPoint(0.5)[1] < arcPoint(0.1)[1], "sun/moon arc: rises right, peaks, sets left");
  console.assert(skyMix(12 * 60).night === 0 && skyMix(23 * 60 + 45).night === 1 && skyMix(17 * 60 + 45).dusk > 0.5 && skyMix(6 * 60).morning > 0.5, "sky follows the sun: day at noon, night at midnight, tints at sunrise/sunset");
  console.assert(sfxFor("2026-12-23", 0) === sfxFor("2026-12-23", 0) && sfxFor("2026-12-23", 0) !== sfxFor("2026-12-23", 1), "sound effects: stable, different per card");
  console.assert(figuresRow({ name: "x", people: ["dad", "choleh", "mum", "darryl"] }).match(/<span class="fig[^"]*">(\w+)/g).join() ===
    ['<span class="fig">Darryl', '<span class="fig child">Choleh', '<span class="fig">Mum', '<span class="fig">Dad'].join(), "figure order");
  console.assert(TRIP.itineraries.length > 1 && TRIP.itineraries.every(function (itinerary) {
    return itinerary.days.length > 0 && itinerary.days.every(function (d) {
      return SCENES[d.scene] && d.weather.every(function (w) { return TRIP.cities[w]; }) &&
        d.cards.length > 0 && d.cards.every(function (c) { return c.people.every(function (p) { return PEOPLE[p]; }); });
    });
  }), "every itinerary day needs a known scene, cities and people");
  var allDaysCheck = combineDays();
  var kyotoCheck = allDaysCheck.filter(function (day) { return day.date === "2026-12-21"; })[0];
  console.assert(allDaysCheck.every(function (day) {
    var people = [];
    return day.cards.every(function (card) {
      return card.people.every(function (person) {
        if (people.indexOf(person) !== -1) return false;
        people.push(person);
        return true;
      });
    }) && people.length <= 7;
  }), "combined itinerary should include each traveller at most once per day");
  console.assert(allDaysCheck.length === 27 && allDaysCheck[0].date === "2026-12-16" &&
    allDaysCheck[allDaysCheck.length - 1].date === "2027-01-11", "all itinerary dates merge into one calendar range");
  console.assert(kyotoCheck && kyotoCheck.cards.length === 2 &&
    kyotoCheck.cards.some(function (card) { return card.people.length === 5 && card.activities.some(function (activity) { return activity.title.indexOf("Osaka") !== -1; }); }),
    "shared Kyoto day combines the family plan without duplicating its placeholder");
</script>
</body>
</html>
